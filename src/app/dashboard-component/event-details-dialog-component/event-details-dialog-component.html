<h2 mat-dialog-title>Event Details</h2>
<mat-dialog-content>
    <!-- Material Table -->
    <table mat-table [dataSource]="events()" class="mat-elevation-z1" style="width: 100%;">

        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef> Date </th>
            <td mat-cell *matCellDef="let element"> {{element.date | date:'short'}} </td>
        </ng-container>

        <ng-container matColumnDef="plate">
            <th mat-header-cell *matHeaderCellDef> Plate </th>
            <td mat-cell *matCellDef="let element"> {{element.plate}} </td>
        </ng-container>

        <ng-container matColumnDef="camera">
            <th mat-header-cell *matHeaderCellDef> Camera </th>
            <td mat-cell *matCellDef="let element"> {{element.camera_id}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</mat-dialog-content>
